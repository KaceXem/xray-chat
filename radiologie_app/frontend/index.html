<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analyse Médicale - Radiologie</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-slate-100 h-screen flex flex-col items-center justify-center p-6 select-none font-sans">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl p-8 border border-slate-200">
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-slate-100">
            <div>
                <h1 class="text-xl font-bold text-slate-800">Compte-rendu Radiologique IA</h1>
                <p class="text-xs text-slate-500">Exécution locale en RAM | Aucune sauvegarde disque</p>
            </div>
            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-medium bg-emerald-50 text-emerald-700 border border-emerald-200">
                <span class="h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                Mémoire sécurisée
            </span>
        </div>

        <div id="drop-zone" class="border-2 border-dashed border-slate-300 rounded-xl p-10 text-center transition-all cursor-pointer bg-slate-50 hover:bg-slate-100 hover:border-indigo-400">
            <svg class="w-12 h-12 mx-auto text-slate-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
            </svg>
            <p class="text-sm font-semibold text-slate-700">Déposez l'image radiologique ou le PDF médical ici</p>
        </div>
<!-- Champ pour le Prompt Personnalisé du Médecin -->
        <div class="mb-4">
           <div class="flex justify-between items-center mb-1">
        <label class="text-xs font-semibold text-slate-700">Votre prompt personnalisé (Consignes & Format) :</label>
         <span class="text-[10px] text-slate-400">Modifiable selon l'examen</span>
         </div>
    <textarea id="custom-prompt" rows="3" class="w-full text-xs p-3 border border-slate-300 rounded-lg bg-slate-50 text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500 resize-none">Tu es un radiologue expert. Analyse cette feuille de travail d'échographie (sonographer worksheet). Rédige un compte-rendu médical d'échographie rigoureusement structuré : Indication, Technique, Résultats détaillés organe par organe, et Conclusion claire.</textarea>
</div>
        <div id="loading-state" class="hidden py-12 text-center">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-3"></div>
            <p class="text-sm font-medium text-slate-600">Traitement en mémoire vive...</p>
        </div>

        <div id="result-container" class="hidden mt-6">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Rapport d'analyse généré</h2>
                <div class="space-x-2">
                    <button id="copy-btn" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 font-medium py-1 px-3 rounded transition">Copier</button>
                    <button id="reset-btn" class="text-xs bg-indigo-50 hover:bg-indigo-100 text-indigo-700 font-medium py-1 px-3 rounded transition">Nouveau document</button>
                </div>
            </div>
            <textarea id="output-text" class="w-full h-64 p-4 text-sm font-mono bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none resize-none" readonly></textarea>
        </div>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
